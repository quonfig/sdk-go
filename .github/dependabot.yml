# Dependabot version updates (SOC 2 SSDLC, qfg-66ko.3). Weekly; minor and
# patch bumps are grouped into one PR per ecosystem, majors stay separate.
# Security updates are enabled in the repo settings and are not grouped here.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    labels:
      - dependencies
      - go
    open-pull-requests-limit: 5
    groups:
      go-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Requires used by non-test code of the published module. A require is
      # the minimum version every consumer's build selects, so a major bump
      # raises the floor for every customer. Raise these deliberately in a
      # release, not via Dependabot.
      #
      # Also review any change to the `go` directive in go.mod by hand: a
      # minor/patch bump of a dependency can raise it, which forces every
      # consumer onto a newer Go toolchain.
      - dependency-name: "github.com/fsnotify/fsnotify"
        update-types: ["version-update:semver-major"]
      - dependency-name: "github.com/spaolacci/murmur3"
        update-types: ["version-update:semver-major"]
      - dependency-name: "gopkg.in/yaml.v3"
        update-types: ["version-update:semver-major"]
