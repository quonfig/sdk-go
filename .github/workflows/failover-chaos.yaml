name: Failover Chaos

# Runs the failover + canonical-ordering chaos rigs (toxiproxy + the
# scenarios-failover/ and scenarios-ordering/ corpus from
# integration-test-data/chaos) against sdk-go. Jeff wants these running all the
# time, so this fires on every push to main + every PR alongside the existing
# Chaos workflow (chaos.yaml, single-upstream suite).
#
# Unlike chaos.yaml, the Go test (TestFailoverChaos / TestOrderingChaos) builds
# api-delivery and spawns its own fixture upstream(s) — one upstream behind the
# primary+secondary proxies for failover, two upstreams at divergent
# Meta.generations for ordering — so this job only has to boot toxiproxy via
# scripts/run-failover-chaos.sh. Wall clock ~3 min.
#
# Scenarios run here: f01-f05 (failover) + o01-o05 (ordering). The parallel-
# failover hedge (qfg-7h5d.1.14) landed, so the previously-skipped o01 (reframed
# to the hedge happy-path: a fast primary wins and the secondary is never
# contacted) and o03 (heal-forward) now run, alongside the new o05 (slow older
# primary loses to a fast newer secondary). CHAOS_SKIP below is empty.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_call:
  workflow_dispatch:
  schedule:
    # Nightly run on main (WS3.2, qfg-41nh.14): post-1.1.0 this suite is
    # otherwise dormant between SDK pushes while api-delivery keeps moving.
    # Cron times are staggered across the six backend SDK repos (06:10-07:25
    # UTC, 15 min apart) to be kind to shared runners and the toxiproxy image
    # pulls. Scheduled runs use repo-level secrets (QUONFIG_REPO_TOKEN is
    # repo-scoped), so the api-delivery checkout works here too. Failure
    # visibility relies on GitHub's default watcher-notification emails —
    # there is no Slack webhook wired into these repos yet.
    - cron: '10 6 * * *'

jobs:
  failover-chaos:
    name: Failover + Ordering Chaos
    runs-on: ubuntu-latest
    # Suite is ~3 min; cap at 30 to absorb warmup + docker pull. Scenarios
    # fail fast inside the Go test via their own wall_clock_seconds, so this
    # only kicks in if something hangs.
    timeout-minutes: 30
    # The `secrets` context cannot be referenced in step `if:` conditions, so
    # surface the token's presence as a job-level env var. Dependabot-triggered
    # runs have no access to repo Actions secrets, so HAS_REPO_TOKEN is 'false'
    # for them and the chaos harness steps below are skipped rather than hard
    # failing.
    env:
      HAS_REPO_TOKEN: ${{ secrets.QUONFIG_REPO_TOKEN != '' }}
    steps:
      - name: Checkout sdk-go
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          path: sdk-go

      - name: Checkout integration-test-data
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: quonfig/integration-test-data
          path: integration-test-data
          # Tracks main: the scenarios-failover/ + scenarios-ordering/ corpus
          # this job drives only exists on main and is not yet in a tag (the
          # latest tag, v2026.05.28, predates it). Pin to a tag once the corpus
          # is rev'd into one, matching chaos.yaml's pinning rationale.
          ref: v2026.06.19.1

      - name: Checkout api-delivery
        # api-delivery is private; the default GITHUB_TOKEN cannot read it. A
        # PAT or fine-grained token with read access to quonfig/api-delivery
        # must be configured as the repo secret QUONFIG_REPO_TOKEN. Dependabot
        # runs do NOT have access to repo Actions secrets, so for those the
        # token is empty and the chaos harness is skipped rather than hard
        # failing — a GitHub Actions version bump can't affect the chaos result
        # anyway, and Test (Go 1.25/1.26) still gates the PR. The two rigs build
        # api-delivery from source (GOWORK=off) to spawn their fixture upstreams.
        if: env.HAS_REPO_TOKEN == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: quonfig/api-delivery
          path: api-delivery
          ref: main
          token: ${{ secrets.QUONFIG_REPO_TOKEN }}

      - if: env.HAS_REPO_TOKEN == 'true'
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version: '1.26'
          cache-dependency-path: |
            sdk-go/go.sum
            api-delivery/go.sum

      - name: Verify docker compose available
        if: env.HAS_REPO_TOKEN == 'true'
        run: docker compose version

      - name: Skipped (no api-delivery access token)
        if: env.HAS_REPO_TOKEN != 'true'
        run: |
          echo "QUONFIG_REPO_TOKEN is not available to this run" \
               "(expected for Dependabot PRs)." \
               "Skipping the failover chaos harness; Test jobs still gate this PR."

      - name: Run failover + ordering chaos rigs
        if: env.HAS_REPO_TOKEN == 'true'
        working-directory: sdk-go
        env:
          # The parallel-failover hedge (qfg-7h5d.1.14) landed, so o01 (reframed
          # to the hedge happy-path), o03 (heal-forward), and o05 (new) all run.
          # Empty CHAOS_SKIP => skip nothing.
          CHAOS_SKIP: ""
          # Cap the go test timeout under the job's timeout-minutes budget so a
          # stuck scenario fails inside the job rather than at the runner limit.
          GO_TEST_TIMEOUT: 25m
        run: ./scripts/run-failover-chaos.sh

      - name: Upload chaos logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: failover-chaos-logs-${{ github.run_id }}
          path: |
            sdk-go/chaos-*.log
          if-no-files-found: ignore
          retention-days: 7
