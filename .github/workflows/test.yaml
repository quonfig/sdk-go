name: Test
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Only versions covered by Go's security backport policy
        # (the two most recent majors). Older versions are EOL — their
        # stdlib CVEs no longer receive fixes, so govulncheck cannot
        # go green on them. Bump as new majors release.
        go-version: ['1.25', '1.26']
    steps:
      - name: Checkout sdk-go
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          path: sdk-go

      - name: Checkout integration-test-data
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: quonfig/integration-test-data
          path: integration-test-data
          # Pinned to a tag (not main) so a typo in shared YAML can't
          # break every SDK's CI at once. Bump to a newer tag when
          # adopting new test cases. See integration-test-data/RELEASING.md.
          ref: v2026.05.20

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: sdk-go/go.sum

      - name: Check formatting
        working-directory: sdk-go
        run: |
          fmt_out=$(gofmt -l .)
          if [ -n "$fmt_out" ]; then
            echo "Files need gofmt:"
            echo "$fmt_out"
            exit 1
          fi

      - name: Vet
        working-directory: sdk-go
        run: go vet ./...

      # Node is needed only to run the integration-test-data generator below.
      - name: Set up Node (integration-test generator)
        if: matrix.go-version == '1.26'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '24'

      # The internal/fixtures/*_generated_test.go files are produced by the
      # integration-test-data generator, not hand-written. Generation is a
      # manual step, so a change to the shared YAML (or the generator) that
      # isn't regenerated here would leave these tests stale while CI stayed
      # green against the old copy. Regenerate from the pinned tag and fail if
      # anything differs from what is committed (the Go generator emits
      # gofmt-clean code, so no format pass is needed).
      - name: Check generated integration tests are in sync
        if: matrix.go-version == '1.26'
        working-directory: sdk-go
        run: |
          (cd ../integration-test-data/generators && npm ci && npm run generate -- --target=go)
          git diff --exit-code internal/fixtures/ \
            || { echo "::error::Generated integration tests are out of sync with integration-test-data. Run 'npm run generate -- --target=go' in integration-test-data/generators and commit the result."; exit 1; }

      - name: Test
        working-directory: sdk-go
        run: go test -race -short ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20  # v9.2.0
        with:
          working-directory: sdk-go

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Run staticcheck
        working-directory: sdk-go
        run: staticcheck ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        working-directory: sdk-go
        # Advisory on Go 1.25 only: 1.25.9 currently has unpatched stdlib
        # CVEs (e.g. GO-2026-4971, GO-2026-4918) that Go 1.26 does not.
        # These are upstream backport delays we cannot fix in this repo;
        # findings still surface as annotations. Drop this line once
        # Go 1.25.x ships with the backports.
        continue-on-error: ${{ matrix.go-version == '1.25' }}
        run: govulncheck ./...
