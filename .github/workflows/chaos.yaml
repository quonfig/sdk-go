name: Chaos

# Runs the cross-SDK chaos harness (toxiproxy + scenarios from
# integration-test-data/chaos) against sdk-go. Boots api-delivery in
# fixture mode and drives every scenario in scenarios/*.yaml through it.
#
# Two modes:
#   - smoke   : skips 11-null-hypothesis (the 30-minute idle scenario);
#               runs on every push to main + every PR (~18 min wall clock).
#   - full    : every scenario; runs on tags + workflow_dispatch (~48 min).
#
# Wired via workflow_call so future release automation can `needs:` it.
# sdk-go currently has no release.yaml (Go modules ship via git tag),
# so the gate today is "the chaos workflow on the tag must be green
# before the tag is published as a release". Best-effort until a
# release.yaml exists. Tracked in the 2026-05-13 reliability audit.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_call:
    inputs:
      mode:
        description: "smoke (skip 11) or full"
        required: false
        type: string
        default: smoke
  workflow_dispatch:
    inputs:
      mode:
        description: "smoke (skip 11) or full"
        required: false
        type: choice
        options: [smoke, full]
        default: smoke

jobs:
  chaos:
    name: Chaos (${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && 'full' || inputs.mode || 'smoke' }})
    runs-on: ubuntu-latest
    # Smoke ~18 min; full ~48 min. Cap at 75 min to allow for warmup +
    # docker pull. Run will fail fast inside the scenario via its own
    # wall_clock_seconds, so this only kicks in if something hangs.
    timeout-minutes: 75
    # The `secrets` context cannot be referenced in step `if:`
    # conditions, so surface the token's presence as a job-level env
    # var. Dependabot-triggered runs have no access to repo Actions
    # secrets, so HAS_REPO_TOKEN is 'false' for them and the chaos
    # harness steps below are skipped rather than hard failing.
    env:
      HAS_REPO_TOKEN: ${{ secrets.QUONFIG_REPO_TOKEN != '' }}
    steps:
      - name: Checkout sdk-go
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          path: sdk-go

      - name: Checkout integration-test-data
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          repository: quonfig/integration-test-data
          path: integration-test-data
          # Pinned per the 2026-05-13 reliability audit so the chaos
          # gate moves only when the scenarios are deliberately
          # rev'd. Bump alongside the matching SDK change.
          ref: v2026.05.13

      - name: Checkout api-delivery
        # api-delivery is private; the default GITHUB_TOKEN cannot read
        # it. A PAT or fine-grained token with read access to
        # quonfig/api-delivery must be configured as the repo secret
        # QUONFIG_REPO_TOKEN. Dependabot-triggered runs do NOT have
        # access to repo Actions secrets (they use a separate
        # dependabot secret store), so for those runs the token is
        # empty and the chaos harness is skipped rather than hard
        # failing — a GitHub Actions version bump can't affect the
        # chaos result anyway, and Test (Go 1.25/1.26) still gates it.
        # On main, tags, and normal PRs the secret is present and the
        # full harness runs.
        if: env.HAS_REPO_TOKEN == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          repository: quonfig/api-delivery
          path: api-delivery
          ref: main
          token: ${{ secrets.QUONFIG_REPO_TOKEN }}

      - if: env.HAS_REPO_TOKEN == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.26'
          cache-dependency-path: |
            sdk-go/go.sum
            api-delivery/go.sum

      - name: Verify docker compose available
        if: env.HAS_REPO_TOKEN == 'true'
        run: docker compose version

      - name: Skipped (no api-delivery access token)
        if: env.HAS_REPO_TOKEN != 'true'
        run: |
          echo "QUONFIG_REPO_TOKEN is not available to this run" \
               "(expected for Dependabot PRs)." \
               "Skipping the chaos harness; Test jobs still gate this PR."

      - name: Run chaos harness
        if: env.HAS_REPO_TOKEN == 'true'
        working-directory: sdk-go
        env:
          # Smoke skips 11-null-hypothesis (30 min idle). Full suite (tag
          # push or mode=full) runs everything. 'none' is a truthy sentinel
          # matching no scenario number; the earlier `&& '' ||` form
          # collapsed to '11' even on mode=full because '' is falsy in
          # GitHub expressions (qfg-hvlc). The wrapper honors CHAOS_SKIP.
          CHAOS_SKIP: ${{ ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || inputs.mode == 'full') && 'none' || '11' }}
          # Cap the go test timeout proportionally so a stuck scenario
          # fails inside the job's timeout-minutes budget.
          GO_TEST_TIMEOUT: 70m
        run: ./scripts/run-chaos.sh

      - name: Upload chaos logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: chaos-logs-${{ github.run_id }}
          path: |
            sdk-go/.chaos-api-delivery
            sdk-go/chaos-*.log
          if-no-files-found: ignore
          retention-days: 7
